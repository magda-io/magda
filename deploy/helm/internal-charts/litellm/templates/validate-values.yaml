{{- /* Render-time model and credential validation; emits no manifest. The models
  themselves are validated by the shared magda.llmModels helper. */ -}}
{{- $models := include "magda.llmModels" . | fromJsonArray -}}
{{- range $index, $model := $models -}}
{{- if empty $model.providerModel -}}
{{- fail (printf "%s.providerModel is required when bundled LiteLLM is enabled" (ternary "global.llmServices.defaultModel" (printf "global.llmServices.additionalModels[%d]" (sub $index 1)) (eq $index 0))) -}}
{{- end -}}
{{- end -}}
{{- $secretName := .Values.providerSecret.name | default "" -}}
{{- $secretKey := .Values.providerSecret.key | default "" -}}
{{- if ne (empty $secretName) (empty $secretKey) -}}
{{- fail "litellm: providerSecret.name and providerSecret.key must either both be set or both be empty" -}}
{{- end -}}
