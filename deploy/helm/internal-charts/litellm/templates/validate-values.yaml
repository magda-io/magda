{{- /* Render-time model and credential validation; emits no manifest. The model
  itself is validated by the shared magda.defaultAgentModel helper. */ -}}
{{- $model := include "magda.defaultAgentModel" . | fromJson -}}
{{- if hasKey .Values "model" -}}
{{- fail "litellm.model.* was removed (#3965): set the alias and provider model in global.defaultAgentModel" -}}
{{- end -}}
{{- if empty $model.providerModel -}}
{{- fail "global.defaultAgentModel.providerModel is required when bundled LiteLLM is enabled" -}}
{{- end -}}
{{- $secretName := .Values.providerSecret.name | default "" -}}
{{- $secretKey := .Values.providerSecret.key | default "" -}}
{{- if ne (empty $secretName) (empty $secretKey) -}}
{{- fail "litellm: providerSecret.name and providerSecret.key must either both be set or both be empty" -}}
{{- end -}}
