{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.masterKeySecret.name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.masterKeySecret.name }}
type: Opaque
stringData:
  {{ .Values.masterKeySecret.key }}: {{ if $existing }}{{ index $existing.data .Values.masterKeySecret.key | b64dec | quote }}{{ else }}{{ randAlphaNum 48 | quote }}{{ end }}
