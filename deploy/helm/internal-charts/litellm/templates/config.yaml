{{- $models := include "magda.llmModels" . | fromJsonArray -}}
{{- $providerSecretConfigured := and .Values.providerSecret.name .Values.providerSecret.key -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
data:
  config.yaml: |
    model_list:
{{- range $models }}
{{- /* LiteLLM sees API values, not levels: send the mapped value of the
  model's reasoningEffort, and nothing for "" or a model that doesn't reason.
  A request that names its own effort (the Workspace always does when it has
  one) overrides this. */ -}}
{{- $reasoningEffort := "" -}}
{{- if and .reasoningEffort (kindIs "map" .reasoningEfforts) -}}
{{- $reasoningEffort = get .reasoningEfforts .reasoningEffort -}}
{{- end }}
      - model_name: {{ .alias | quote }}
        litellm_params:
          model: {{ .providerModel | quote }}
{{- if $providerSecretConfigured }}
          api_key: "os.environ/LITELLM_PROVIDER_API_KEY"
{{- end }}
{{- with $reasoningEffort }}
          reasoning_effort: {{ . | quote }}
{{- end }}
{{- end }}
    general_settings:
      master_key: "os.environ/LITELLM_MASTER_KEY"
      database_url: null
    litellm_settings:
      drop_params: true
