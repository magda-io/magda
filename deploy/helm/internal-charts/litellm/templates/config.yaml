apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
data:
  config.yaml: |
    model_list:
      - model_name: {{ .Values.model.alias | quote }}
        litellm_params:
          model: {{ .Values.model.providerModel | quote }}
          api_key: "os.environ/{{ .Values.model.apiKeyEnv }}"
    general_settings:
      master_key: "os.environ/LITELLM_MASTER_KEY"
      database_url: null
    litellm_settings:
      drop_params: true
