global:
  defaultAgentModel: {}

image:
  repository: ghcr.io/berriai
  name: litellm
  tag: main-v1.81.12-stable
  pullPolicy: IfNotPresent
# Optional chart-specific overrides. Empty values inherit
# global.defaultAgentModel from the parent chart. Reasoning effort is global-only
# so DSH and bundled LiteLLM cannot diverge.
model:
  # -- Public LiteLLM model alias override.
  alias: ""
  # -- Provider-specific LiteLLM model override.
  providerModel: ""
providerSecret:
  # -- Provider API-key Secret name. Leave name and key empty for providers that do not need a key.
  name: litellm-provider
  # -- Provider API-key Secret key. Leave name and key empty for providers that do not need a key.
  key: api-key
masterKeySecret:
  # Create and retain a stable release-owned master key. Set false to reference
  # an existing operator-managed secret.
  create: true
  name: magda-litellm-master-key
  key: master-key
service:
  name: litellm
  port: 4000
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: "1", memory: 1Gi}
