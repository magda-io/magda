global: {}

image:
  # -- Magda's copy of the upstream LiteLLM image (`ghcr.io/berriai/litellm`,
  # same tag and digest), so a deployment doesn't depend on the upstream
  # registry.
  repository: ghcr.io/magda-io
  name: litellm
  # -- 1.83.14 fixes the first streams after a LiteLLM start ending without
  # `response.completed` or usage on 1.81.12 (#3945).
  tag: v1.83.14-stable.patch.3
  pullPolicy: IfNotPresent
# The models (one route each: alias, provider model and reasoning effort) come
# only from global.llmServices.defaultModel and additionalModels, so LiteLLM,
# LLM Services and the Agent Workspace can't disagree. Every route uses the one
# provider Secret below.
providerSecret:
  # -- Provider API-key Secret name. Leave name and key empty for providers that do not need a key.
  name: litellm-provider
  # -- Provider API-key Secret key. Leave name and key empty for providers that do not need a key.
  key: api-key
masterKeySecret:
  # Create and retain a stable release-owned master key. Set false to reference
  # an existing operator-managed secret.
  create: true
  name: magda-litellm-master-key
  key: master-key
service:
  name: litellm
  port: 4000
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: "1", memory: 1Gi}
