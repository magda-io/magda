image:
  repository: ghcr.io/berriai
  name: litellm
  tag: main-v1.81.12-stable
  pullPolicy: IfNotPresent
model:
  alias: gpt-5.6-sol
  providerModel: openai/gpt-5.6-sol
  apiKeyEnv: OPENAI_API_KEY
  reasoningEffort: medium
providerSecret:
  name: litellm-provider
  key: api-key
masterKeySecret:
  # Create and retain a stable release-owned master key. Set false to reference
  # an existing operator-managed secret.
  create: true
  name: magda-litellm-master-key
  key: master-key
service:
  name: litellm
  port: 4000
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: "1", memory: 1Gi}
