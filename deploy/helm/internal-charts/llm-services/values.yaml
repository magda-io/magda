global:
  defaultAgentModel: {}

image:
  name: magda-llm-services
  tag: ""
  pullPolicy: IfNotPresent
replicas: 1
# -- Deployment-wide model allowlist. An empty array inherits
# global.defaultAgentModel.alias from the parent chart. Bundled LiteLLM requires
# exactly one matching alias; external backends may use multiple aliases.
allowedModels: []

# External LiteLLM-compatible backend. Leave empty when the bundled LiteLLM
# subchart is enabled. When bundled LiteLLM is disabled all three fields are
# required, and the operator must ensure every allowed model alias exists on the
# external backend.
backend:
  url: ""
  masterKeySecret:
    name: ""
    key: ""

# Optional bundled static LiteLLM router. Child values not repeated here use the
# defaults from the litellm chart.
litellm:
  enabled: true

# Usage metering (#3838). Approximate token volume for soft limits, not billing.
# -- How long, in seconds, a caller's `llm/access/invoke` decision is cached
# (0 to 300; 0 disables the cache). This is the delay before a revoked grant
# stops working. Profile changes apply at once.
decisionCacheSeconds: 30

usage:
  # -- IANA time zone of the usage ledger's days, ISO weeks and months. A
  # request counts for the local date it started. Don't change it on a live
  # deployment without a plan: existing dates aren't reinterpreted.
  timeZone: Australia/Sydney
  estimate:
    # -- When a model response has no valid final usage (missing, unreadable, or
    # cut short by a disconnect or timeout), it's charged an estimate:
    # ceil(request body bytes / bytesPerToken) + outputTokens. Error answers
    # (any non-2xx status) cost nothing.
    bytesPerToken: 4
    # -- Estimated output tokens per request without final usage.
    outputTokens: 4096
    # -- Optional per-model-alias override of `outputTokens`, e.g. `{"my-alias": 8192}`.
    outputTokensByModel: {}
  observer:
    # -- Largest server-sent event, in bytes, the usage observer buffers. A larger
    # event is skipped for metering (still forwarded unchanged).
    maxEventBytes: 65536
    # -- Largest non-streaming JSON response, in bytes, the observer buffers.
    maxJsonBytes: 1048576

resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 500m, memory: 256Mi}
