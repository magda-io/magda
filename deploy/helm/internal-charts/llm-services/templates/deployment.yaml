apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-services
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {service: llm-services}
  template:
    metadata:
      labels: {service: llm-services}
    spec:
{{ include "magda.imagePullSecrets" . | indent 6 }}
      automountServiceAccountToken: false
      containers:
        - name: llm-services
          image: {{ include "magda.image" . | quote }}
          imagePullPolicy: {{ include "magda.imagePullPolicy" . | quote }}
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: PORT, value: "8080"}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: auth-secrets, key: jwt-secret}
            - {name: AUTH_API_URL, value: "http://authorization-api/v0"}
            - {name: LITELLM_URL, value: "http://litellm:4000"}
            - {name: ALLOWED_MODELS, value: {{ .Values.allowedModels | quote }}}
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.masterKeySecret.name }}
                  key: {{ .Values.masterKeySecret.key }}
          readinessProbe:
            httpGet: {path: /v0/status/ready, port: http}
          livenessProbe:
            httpGet: {path: /v0/status/live, port: http}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
