{{- $allowedModelsJson := include "llm-services.effectiveAllowedModelsJson" . -}}
{{- $backendUrl := .Values.backend.url -}}
{{- $secretName := .Values.backend.masterKeySecret.name -}}
{{- $secretKey := .Values.backend.masterKeySecret.key -}}
{{- if .Values.litellm.enabled -}}
{{- $backendUrl = printf "http://%s:%v" .Values.litellm.service.name .Values.litellm.service.port -}}
{{- $secretName = .Values.litellm.masterKeySecret.name -}}
{{- $secretKey = .Values.litellm.masterKeySecret.key -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-services
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {service: llm-services}
  template:
    metadata:
      labels:
        service: llm-services
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
    spec:
{{ include "magda.imagePullSecrets" . | indent 6 }}
      automountServiceAccountToken: false
      containers:
        - name: llm-services
          image: {{ include "magda.image" . | quote }}
          imagePullPolicy: {{ include "magda.imagePullPolicy" . | quote }}
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: PORT, value: "8080"}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: auth-secrets, key: jwt-secret}
            - {name: AUTH_API_URL, value: "http://authorization-api/v0"}
            - {name: LITELLM_URL, value: {{ $backendUrl | quote }}}
            - {name: ALLOWED_MODELS, value: {{ $allowedModelsJson | quote }}}
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $secretKey }}
            # usage metering (#3838)
            # Auth API changes for access profiles use an internal session for this user (#3838 AUTH-12)
            - {name: DEFAULT_ADMIN_USER_ID, value: {{ .Values.global.defaultAdminUserId | quote }}}
            - {name: DECISION_CACHE_SECONDS, value: {{ .Values.decisionCacheSeconds | int | quote }}}
            - {name: USAGE_TIME_ZONE, value: {{ .Values.usage.timeZone | quote }}}
            - {name: USAGE_ESTIMATE_BYTES_PER_TOKEN, value: {{ .Values.usage.estimate.bytesPerToken | int | quote }}}
            - {name: USAGE_ESTIMATE_OUTPUT_TOKENS, value: {{ .Values.usage.estimate.outputTokens | int | quote }}}
            - {name: USAGE_ESTIMATE_OUTPUT_TOKENS_BY_MODEL, value: {{ .Values.usage.estimate.outputTokensByModel | default dict | toJson | quote }}}
            - {name: USAGE_OBSERVER_MAX_EVENT_BYTES, value: {{ .Values.usage.observer.maxEventBytes | int | quote }}}
            - {name: USAGE_OBSERVER_MAX_JSON_BYTES, value: {{ .Values.usage.observer.maxJsonBytes | int | quote }}}
            # LLM Services database: access profiles and token usage (#3838)
            - {name: DB_HOST, value: "llm-services-db"}
            - {name: DB_PORT, value: "5432"}
            {{- include "magda.db-client-credential-env" (dict "dbName" "llm-services-db" "root" .) | indent 12 }}
            {{- include "magda.db-client-sslmode-env" . | indent 12 }}
            {{- include "magda.db-client-ca-env-node" . | indent 12 }}
{{- if eq (include "magda.postgres-client-ca-enabled" .) "true" }}
          volumeMounts:
          {{- include "magda.postgres-client-ca-volumemount" . | nindent 12 }}
{{- end }}
          readinessProbe:
            httpGet: {path: /v0/status/ready, port: http}
          livenessProbe:
            httpGet: {path: /v0/status/live, port: http}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
{{- if eq (include "magda.postgres-client-ca-enabled" .) "true" }}
      volumes:
      {{- include "magda.postgres-client-ca-volume" . | nindent 8 }}
{{- end }}
