{{- $sandboxNamespace := include "agent-services.sandboxNamespace" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
{{ include "agent-services.installationLabels" . | indent 4 }}
---
# This installation-scoped identity is intentionally granted no Kubernetes RBAC
# or cloud IAM permissions by this chart. Sandbox Pods reference it explicitly.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent-services.sandboxServiceAccountName" . }}
  namespace: {{ $sandboxNamespace }}
  labels:
{{ include "agent-services.installationLabels" . | indent 4 }}
automountServiceAccountToken: false
