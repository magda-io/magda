{{- /* Render-time validation only; this template emits no manifest. */ -}}
{{- $runtimeType := .Values.warmPool.type | toString | lower -}}
{{- if not (has $runtimeType (list "runc" "gvisor" "kata")) -}}
{{- fail (printf "agent-services.warmPool.type must be one of runc, gvisor, or kata; got %q" .Values.warmPool.type) -}}
{{- end -}}

{{- $size := .Values.warmPool.size -}}
{{- $sizeKind := kindOf $size -}}
{{- if not (has $sizeKind (list "int" "int64" "float64")) -}}
{{- fail (printf "agent-services.warmPool.size must be a non-negative integer; got %v (%s)" $size $sizeKind) -}}
{{- end -}}
{{- $sizeFloat := float64 $size -}}
{{- if or (lt $sizeFloat 0.0) (ne $sizeFloat (floor $sizeFloat)) -}}
{{- fail (printf "agent-services.warmPool.size must be a non-negative integer; got %v" $size) -}}
{{- end -}}

{{- if and (ne $runtimeType "runc") (empty (get .Values.runtimeClasses $runtimeType)) -}}
{{- fail (printf "agent-services.runtimeClasses.%s is required when warmPool.type=%s" $runtimeType $runtimeType) -}}
{{- end -}}

{{- $maxUpload := dig "agentWorkspace" "maxUploadBytes" 1073741824 .Values.global -}}
{{- if not (has (kindOf $maxUpload) (list "int" "int64" "float64")) -}}
{{- fail (printf "global.agentWorkspace.maxUploadBytes must be a positive integer; got %v (%s)" $maxUpload (kindOf $maxUpload)) -}}
{{- end -}}
{{- if or (le (float64 $maxUpload) 0.0) (ne (float64 $maxUpload) (floor (float64 $maxUpload))) -}}
{{- fail (printf "global.agentWorkspace.maxUploadBytes must be a positive integer; got %v" $maxUpload) -}}
{{- end -}}

{{- /* The model config is validated by the shared magda.defaultAgentModel helper. */ -}}
{{- $_ := include "magda.defaultAgentModel" . -}}
{{- if hasKey .Values "llm" -}}
{{- fail "agent-services.llm.* was removed (#3965): set the Workspace model in global.defaultAgentModel" -}}
{{- end -}}

{{- range $name, $value := dict
    "skillArchive.maxCompressedBytes" .Values.skillArchive.maxCompressedBytes
    "skillArchive.maxUncompressedBytes" .Values.skillArchive.maxUncompressedBytes
    "skillArchive.maxEntries" .Values.skillArchive.maxEntries
    "skillArchive.maxPathLength" .Values.skillArchive.maxPathLength
    "skillArchive.maxNestingDepth" .Values.skillArchive.maxNestingDepth
    "skillArchive.maxMarkdownBytes" .Values.skillArchive.maxMarkdownBytes -}}
{{- $kind := kindOf $value -}}
{{- if not (has $kind (list "int" "int64" "float64")) -}}
{{- fail (printf "agent-services.%s must be a positive integer; got %v (%s)" $name $value $kind) -}}
{{- end -}}
{{- $number := float64 $value -}}
{{- if or (le $number 0.0) (ne $number (floor $number)) -}}
{{- fail (printf "agent-services.%s must be a positive integer; got %v" $name $value) -}}
{{- end -}}
{{- end -}}
{{- if gt (float64 .Values.skillArchive.maxMarkdownBytes) (float64 .Values.skillArchive.maxUncompressedBytes) -}}
{{- fail "agent-services.skillArchive.maxMarkdownBytes must not exceed maxUncompressedBytes" -}}
{{- end -}}
{{- if or (empty (trim .Values.registryApiUrl)) (empty (trim .Values.storageApiUrl)) (empty (get .Values.global "defaultDatasetBucket" | default "" | toString | trim)) -}}
{{- fail "agent-services registryApiUrl, storageApiUrl, and global.defaultDatasetBucket must be non-empty" -}}
{{- end -}}
{{- $tenantIdKind := kindOf .Values.tenantId -}}
{{- if not (has $tenantIdKind (list "int" "int64" "float64")) -}}
{{- fail (printf "agent-services.tenantId must be a non-negative integer; got %v (%s)" .Values.tenantId $tenantIdKind) -}}
{{- end -}}
{{- $tenantIdFloat := float64 .Values.tenantId -}}
{{- if or (lt $tenantIdFloat 0.0) (ne $tenantIdFloat (floor $tenantIdFloat)) -}}
{{- fail "agent-services.tenantId must be a non-negative integer" -}}
{{- end -}}

{{- $namespaceOverride := dig "agentWorkspace" "sandboxNamespace" "" .Values.global | toString | trim -}}
{{- if $namespaceOverride -}}
{{- if or (gt (len $namespaceOverride) 63) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $namespaceOverride)) -}}
{{- fail (printf "global.agentWorkspace.sandboxNamespace must be a valid DNS-1123 label of at most 63 characters; got %q" $namespaceOverride) -}}
{{- end -}}
{{- end -}}
