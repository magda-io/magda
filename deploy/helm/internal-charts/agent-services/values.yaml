# -- Global values are owned and defaulted by the parent `magda-core` chart.
# This chart requires `global.externalUrl`, `global.defaultAdminUserId`,
# `global.defaultDatasetBucket`, `global.llmServices` (the models) and
# `global.image` from its parent and fails rendering when a required value is
# absent.
global: {}

manager:
  image:
    name: magda-agent-manager
    tag: ""
    pullPolicy: IfNotPresent
  # -- Must remain one because lifecycle reconciliation is single-writer.
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {cpu: 500m, memory: 384Mi}

runtime:
  image:
    name: magda-agent-runtime
    tag: ""
    pullPolicy: IfNotPresent
  dshVersion: 0.2.1-alpha.1
  storage:
    # -- Default per-user PVC capacity. Existing PVCs are not resized automatically.
    size: 10Gi
    storageClassName: ""
  # Per-Workspace container resources. Scheduling reserves only `requests`;
  # `limits` is a cap, and memory above it is OOM-killed. Each LibreOffice Kit
  # render, conversion or recalculation peaks at about 1.2 GiB, so keep the
  # memory limit at 2560Mi or higher.
  resources:
    requests: {cpu: 100m, memory: 384Mi, ephemeral-storage: 256Mi}
    limits: {cpu: "1", memory: 2560Mi, ephemeral-storage: 1Gi}
  hostAliases: []
  externalPrivateCidrs: []
  externalPrivatePorts: [80, 443]
  # -- Additional public destinations denied by the broad public egress rule,
  # such as a GKE public control-plane endpoint (/32).
  deniedCidrs: []
  trustedCaSecret:
    name: ""
    key: ca.crt

# runc is intended for trusted local development. Use gvisor or kata for
# production after qualifying the selected RuntimeClass on the target cluster.
warmPool:
  type: gvisor
  size: 2
runtimeClasses:
  gvisor: gvisor
  kata: kata

sandboxNamespace:
  create: true
  annotations:
    helm.sh/resource-policy: keep
  labels: {}

managedApiKeyNamePrefix: magda-agent-workspace
controlPlaneSecret:
  # Create a stable release-owned secret when true. Set false to reference an
  # existing operator-managed secret.
  create: true
  name: magda-agent-control
  key: token
runtimePrefix: /v0/runtime
magdaApiUrl: ""
llmApiUrl: ""
registryApiUrl: http://registry-api/v0
storageApiUrl: http://storage-api/v0
tenantId: 0
skillArchive:
  maxCompressedBytes: 8388608
  maxUncompressedBytes: 33554432
  maxEntries: 256
  maxPathLength: 240
  maxNestingDepth: 8
  maxMarkdownBytes: 1048576
hardDeleteSeconds: 28800
idleSuspendSeconds: 1800
reconcileIntervalSeconds: 30
# -- Largest buffered request body, in bytes, the Manager accepts for a
# Workspace's runtime; a larger one is answered with 413. The Manager buffers
# these requests in memory. Attachment uploads are streamed instead, up to
# `global.agentWorkspace.maxUploadBytes`.
runtimeMaxBodyBytes: 16777216
# The Workspace's model: one of the models LLM Services serves
# (global.llmServices.defaultModel or additionalModels), selected by alias.
# What the model can do (its limits and reasoning levels) comes only from that
# entry; only the efforts can be chosen here. Running Workspaces pick up a
# change the next time they're resumed.
model:
  # -- Alias of the Workspace's model. Empty: the default model
  # (`global.llmServices.defaultModel`).
  alias: ""
  # -- (string) Effort for the Workspace's main turns: a level the model
  # declares. Empty or unset: the model entry's `reasoningEffort`.
  # @default -- `null` (the model entry's)
  reasoningEffort: null
  # -- (string) Effort for session titles and context compaction: a level the
  # model declares. Empty: the model entry's `reasoningEffort`. Unset: the
  # model entry's `auxiliaryReasoningEffort` if set, else the Workspace's
  # main-turn effort.
  # @default -- `null` (the model entry's, else the main-turn effort)
  auxiliaryReasoningEffort: null
# ServiceAccount used by Agent Manager in the Magda release namespace. Sandbox
# Pods use a separate installation-scoped, no-RBAC ServiceAccount created in the
# Sandbox namespace; its name is generated to avoid shared-namespace collisions.
serviceAccount:
  name: magda-agent-manager

kasValidation:
  enabled: true
  image:
    repository: alpine/k8s
    tag: 1.31.5
    pullPolicy: IfNotPresent

ingressController:
  namespace: ingress-nginx
  podLabels:
    app.kubernetes.io/component: controller
