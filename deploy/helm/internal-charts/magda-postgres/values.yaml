global:
  postgresql:
    auth:
      # -- see `magda-core` chart document
      existingSecret: "db-main-account-secret"
      # -- PostgreSQL username
      # The created user will have superuser privileges if username is postgres
      # For in k8s PostgreSQL, we should use `postgres` so it has privileges for DB schema migrators to run
      username: "postgres"
      # -- Default database name to be created. At the moment, its value must be `postgres`.
      database: "postgres"
    # -- Whether auto create password secret. More see `magda-core` chart document
    autoCreateSecret: true
  security:
    # -- Required. Since bitnami chart 16.x the subchart hard-fails rendering (via
    # `common.errors.insecureImages`) whenever any container image has been replaced
    # with one that is not the upstream bitnami default. Magda serves ALL images from
    # its own ghcr mirror (`ghcr.io/magda-io/...`) rather than `docker.io/bitnami`
    # (whose tags now resolve only from the frozen `bitnamilegacy/*` namespace),
    # so that guard would fire on every render, permanently. Setting this to `true`
    # skips the image verification, not any other check.
    # NOTE: `global.*` values are release-wide — Helm merges every subchart's
    # `global` block into one shared namespace — so setting this here also applies
    # to the rest of the release, not just this chart's own postgresql subchart.
    allowInsecureImages: true

postgresql:
  # -- Set `fullnameOverride` & `nameOverride` to fixed value so it's easier to manage the naming pattern.
  # And point k8s service to DB instance.
  # The `-pg17` suffix names the PostgreSQL *major generation*, not the Magda version.
  # It exists so a major upgrade can run the new instance side-by-side with the old one:
  # the pod labels this chart emits land in the StatefulSet's immutable `spec.selector`,
  # so an in-place `helm upgrade` across a subchart major is impossible. Bump the suffix
  # (and `majorUpgrade.sourceHost` in each wrapper chart) at the next major upgrade.
  fullnameOverride: "default-db-postgresql-pg17"
  # -- See `fullnameOverride`.
  nameOverride: "default-db-postgresql-pg17"

  auth:
    secretKeys:
      # -- Secret key holding the password bitnami uses for the built-in `postgres`
      # superuser. Deliberately conditional, because bitnami reads the *admin* key when
      # the username is `postgres` and the *user* key otherwise (see
      # `postgresql.v1.userPasswordKey` in the subchart's `_helpers.tpl`). Magda's
      # `db-main-account-secret` keeps ONE key for the privileged account
      # (`postgresql-password`) and adds `postgresql-postgres-password` only when a
      # non-default username is in use, so this conditional makes bitnami read the key
      # that actually exists in both cases. `secretKeys.*` are run through `tpl`, which
      # is what makes it possible.
      # Flatten this at your peril: pointing `adminPasswordKey` at
      # `postgresql-postgres-password` unconditionally makes the DB come up with a
      # password no Magda client knows, and pointing it at `postgresql-password`
      # unconditionally gives the `postgres` superuser the custom user's password.
      adminPasswordKey: '{{ if eq (include "postgresql.v1.username" .) "postgres" }}postgresql-password{{ else }}postgresql-postgres-password{{ end }}'
      # -- Secret key holding the privileged (custom) user's password.
      userPasswordKey: "postgresql-password"

  tls:
    # -- Whether the in-cluster PostgreSQL serves TLS. This is THE switch for the
    # server's TLS listener — `tls-secret.yaml` is gated on this exact value, so the
    # certificate secret is created if and only if the subchart's StatefulSet mounts
    # it. There is deliberately no `global.*` equivalent: this is a subchart value
    # consumed directly by bitnami's own templates, and a wrapper chart's
    # `values.yaml` cannot compute a subchart value from another value, so a global
    # switch could only ever be a second source of truth that silently disagrees
    # with what the StatefulSet actually does.
    # To turn the listener off, override it on every DB chart that deploys an
    # in-cluster instance, and switch the clients to plaintext as well (see
    # `templates/validate-tls.yaml`, which rejects the inconsistent combination):
    # ```yaml
    # global:
    #   postgresql:
    #     client:
    #       sslmode: disable
    # combined-db: &dbTlsOff
    #   magda-postgres:
    #     postgresql:
    #       tls:
    #         enabled: false
    # authorization-db: *dbTlsOff
    # content-db: *dbTlsOff
    # registry-db: *dbTlsOff
    # session-db: *dbTlsOff
    # tenant-db: *dbTlsOff
    # ```
    enabled: true
    # -- Use Magda's own certificate secret rather than bitnami's `autoGenerated`,
    # which mints a new CA on every `helm upgrade`.
    autoGenerated: false
    # -- Name of the secret holding the server certificate, created by `tls-secret.yaml`.
    # Since bitnami postgresql 12 this value IS run through `tpl` (by the
    # `postgresql.v1.tlsSecretName` helper), so it can be derived from
    # `fullnameOverride` here instead of being repeated in every wrapper chart.
    # `magda-postgres/templates/tls-secret.yaml` renders it through the same `tpl` in a
    # synthetic subchart context, so the secret this chart creates and the secret the
    # StatefulSet mounts cannot drift apart.
    certificatesSecret: "{{ .Values.fullnameOverride }}-crt"
    # -- Filename (within the mounted certificate secret) of the server certificate.
    certFilename: "tls.crt"
    # -- Filename (within the mounted certificate secret) of the server private key.
    certKeyFilename: "tls.key"
    # NOTE: deliberately NOT setting certCAFilename. Setting it makes bitnami write a
    # `hostssl all all 0.0.0.0/0 cert` pg_hba rule requiring client certificates,
    # which would lock out every existing plaintext client.

  volumePermissions:
    # -- No longer needed. Since bitnami chart 11.0.5 the certificate is staged into the
    # `postgresql-certificates` emptyDir by a NON-privileged `copy-certs` init container
    # gated on `tls.enabled && not volumePermissions.enabled`, and the old
    # "When TLS is enabled you must enable volumePermissions as well" hard-fail is gone.
    # Keeping this `false` is what satisfies the OpenShift restricted-SCC criterion: no
    # init container runs as root.
    enabled: false
    image:
      # -- Registry hosting the `os-shell` image. Still required even though the
      # `volumePermissions` init container is disabled: the `copy-certs` init container
      # Magda DOES use resolves its image from this same key
      # (`postgresql.v1.volumePermissions.image`).
      registry: "ghcr.io"
      # -- Repository (within `registry`) of the `os-shell` image. Magda's mirror of the
      # bitnami image; never `docker.io/bitnami`, whose tags now resolve only from the
      # frozen `bitnamilegacy/*` namespace.
      repository: "magda-io/third-party/bitnami/os-shell"
      # -- Tag of the `os-shell` image. Pinned independently of `postgresql.image.tag`
      # and not auto-updated by `yarn set-version`.
      tag: "12-debian-12-r50"
      # -- Pull policy for the `os-shell` image.
      pullPolicy: "IfNotPresent"

  metrics:
    image:
      # -- Registry hosting the postgres-exporter metrics sidecar image.
      registry: "ghcr.io"
      # -- Repository (within `registry`) of the metrics sidecar image. Magda's mirror.
      # Only pulled when `metrics.enabled` is true (off by default), but overridden
      # anyway so no configuration can reach `docker.io/bitnami`.
      repository: "magda-io/third-party/bitnami/postgres-exporter"
      # -- Tag of the metrics sidecar image.
      tag: "0.17.1-debian-12-r14"
      # -- Pull policy for the metrics sidecar image.
      pullPolicy: "IfNotPresent"

  image:
    # -- the default docker image tag/version used by the postgresql chart. 
    # When dump the magda version using `yarn set-version` (at magda repo root), this default version will be auto-replaced with the new chart version number.
    tag: "6.1.1"
    repository: "magda-io/magda-postgres"
    registry: "ghcr.io"

  primary:
    # -- extra volumes can be set here.
    # e.g. map backup storage config secret as files in /etc/wal-g.d/env
    extraVolumes: []
    # -- extra volume mount can be set here.
    # e.g. mount backup storage config secret and map as files in /etc/wal-g.d/env
    extraVolumeMounts: []
    # --- Set priority class of the primary database instance.
    # When `global.enablePriorityClass` is `true`. We should set this config to "magda-9" to make sure db instance get appropriate schedule priority.
    # By default, Magda will create priorityClassName from "magda-10" to "magda-0"
    # where "magda-10" indicates the highest priority.
    priorityClassName: ""

    containerSecurityContext:
      # -- Restores the group the process ran with under bitnami chart 10.9.1, which set
      # only `runAsUser` and so inherited the image's `gid=0`. The `magda-postgres`
      # Dockerfile follows the OpenShift arbitrary-UID guideline and grants write access
      # via GROUP 0 (`chgrp -R 0 /wal-g /etc/wal-g.d/env`, `chmod -R g=u`), so the
      # chart's new `runAsGroup: 1001` default would leave `/wal-g` unwritable and break
      # recovery mode. `runAsNonRoot` still holds — group 0 is not uid 0.
      runAsGroup: 0
      # -- The chart's new default is `true`, and it provides emptyDir subPaths for
      # `/tmp`, `/opt/bitnami/postgresql/conf` and `/opt/bitnami/postgresql/tmp` — but
      # NOT for `/wal-g`, where `recover.sh` writes `base-backup.fetching`, `pg_wal/`
      # and `recovery.complete`. With a read-only root filesystem a restore fails with
      # EROFS, and only a restore fails: normal boot looks perfectly healthy.
      # Hardening this properly means relocating the wal-g scripts and mounting an
      # emptyDir at /wal-g — tracked separately.
      readOnlyRootFilesystem: false

    # -- the name of config map contains entended postgresql config options.
    # You should not change this value as this configMap is auto-generated.
    # If you want to override the postgresql conf option, you should add options to `.Values.config` field of `magda-postgres` chart.
    # Please note: For this field, you can use template string e.g. "{{ .Values.fullnameOverride }}" to reference any values passed to subchat `postgresql`.
    # See more: https://helm.sh/docs/howto/charts_tips_and_tricks/#using-the-tpl-function
    # NOTE the key spelling: `existingExtendedConfigmap`, one "Conf", lowercase "map".
    existingExtendedConfigmap: "{{ .Values.fullnameOverride }}-extended-config"

    # -- the name of config map contains extra env vars for postgresql pod.
    # You should not change this value as this configMap is auto-generated.
    # If you want to add extra env vars, you should add vars to `.Values.envVars` field of `magda-postgres` chart.
    # MUST BE A PLAIN STRING, and every chart that overrides `fullnameOverride` must
    # override this to match. Unlike `existingExtendedConfigmap` and
    # `initdb.scriptsConfigMap` above, the subchart does NOT run this value through
    # `tpl` — bitnami 10.9.1 did (`statefulset.yaml:362`), 16.7.24 does not
    # (`primary/statefulset.yaml:403`). A "{{ .Values.fullnameOverride }}" string would
    # be emitted literally, producing an invalid ConfigMap reference: no wal-g
    # environment, no backup mode, no recovery mode.
    # `templates/validate-names.yaml` fails the render if this drifts from
    # `<fullnameOverride>-extra-env-vars`.
    extraEnvVarsCM: "default-db-postgresql-pg17-extra-env-vars"

    initdb:
      # -- the name of config map contains initdb scripts run at first boot.
      # You should not change this value as this configMap is auto-generated (see `initdb-scripts-configmap.yaml`).
      # The script grants `CREATEDB` & `CREATEROLE` to the privileged DB user so that, when a
      # non-default (non-`postgres`) username is used, it can still create databases and the
      # restricted `client` role for the DB migrators — matching the privilege level that
      # managed providers (RDS `rds_superuser`, Azure `azure_pg_admin`, GCP `cloudsqlsuperuser`)
      # grant their admin account, without requiring a true superuser. For the default `postgres`
      # user the grant is a harmless no-op.
      scriptsConfigMap: "{{ .Values.fullnameOverride }}-initdb-scripts"
      # -- the DB user used to run the initdb scripts (see `scriptsConfigMap`).
      # Must be the built-in `postgres` superuser: the script grants CREATEDB/CREATEROLE
      # to the privileged user, which that user cannot grant to itself. Bitnami defaults
      # this to the `auth.username`, which is wrong for our purposes whenever a
      # non-default privileged username is in use.
      # No password is needed — bitnami's init-time pg_hba.conf trusts local socket
      # connections, and the init scripts connect over the local socket.
      user: "postgres"

    persistence:
      # -- set the persistence volume size of the postgresql statefulset
      size: "50Gi"
    # -- Set the resource config for the postgresql container
    resources:
      requests:
        cpu: 200m
        memory: 500Mi

    # -- Custom Liveness Probe for postgresql.
    # when in recovery mode, only check whether the base backup is still being fetched.
    # Set as `customLivenessProbe`, which the subchart honours unconditionally — the
    # `livenessProbe.enabled: false` workaround the 10.9.1 contract needed is gone.
    # NOTE: this (and `customReadinessProbe` below) MUST stay a plain multiline string,
    # not a map, because it embeds the subchart's own `{{ }}` template helpers, which
    # only resolve correctly when rendered via `common.tplvalues.render` against the
    # subchart's own context. The subchart's `values.schema.json` declares both fields
    # as objects, so every `helm template`/`helm install` prints a
    # `coalesce.go:316: warning: cannot overwrite table with non table for ...` for
    # each of the two. This is expected and harmless — the string still wins and
    # renders correctly — not a sign of misconfiguration.
    customLivenessProbe: |
      exec:
        command:
          - /bin/sh
          - -c
          - |
            if [ -f /wal-g/base-backup.fetching ]
            then
            exit 0
            fi
          {{- if (include "postgresql.v1.database" .) }}
            exec pg_isready -U {{ include "postgresql.v1.username" . | default "postgres" | quote }} -d "dbname={{ include "postgresql.v1.database" . }} {{- if and .Values.tls.enabled .Values.tls.certCAFilename }} sslcert={{ include "postgresql.v1.tlsCert" . }} sslkey={{ include "postgresql.v1.tlsCertKey" . }}{{- end }}" -h 127.0.0.1 -p {{ .Values.containerPorts.postgresql }}
          {{- else }}
            exec pg_isready -U {{ include "postgresql.v1.username" . | default "postgres" | quote }} {{- if and .Values.tls.enabled .Values.tls.certCAFilename }} -d "sslcert={{ include "postgresql.v1.tlsCert" . }} sslkey={{ include "postgresql.v1.tlsCertKey" . }}"{{- end }} -h 127.0.0.1 -p {{ .Values.containerPorts.postgresql }}
          {{- end }}
      initialDelaySeconds: {{ .Values.primary.livenessProbe.initialDelaySeconds }}
      periodSeconds: {{ .Values.primary.livenessProbe.periodSeconds }}
      timeoutSeconds: {{ .Values.primary.livenessProbe.timeoutSeconds }}
      successThreshold: {{ .Values.primary.livenessProbe.successThreshold }}
      failureThreshold: {{ .Values.primary.livenessProbe.failureThreshold }}

    # -- Custom Readiness Probe for postgresql.
    # when in recovery mode, only check whether the base backup is still being fetched.
    # NOTE the TLS condition here is `tls.enabled` alone, whereas the liveness probe also
    # requires `certCAFilename`. That asymmetry is pre-existing and preserved deliberately:
    # this is what ships and works today, and aligning them is a behaviour change.
    customReadinessProbe: |
      exec:
        command:
          - /bin/sh
          - -c
          - -e
          - |
            if [ -f /wal-g/base-backup.fetching ]
            then
            exit 0
            fi
          {{- if (include "postgresql.v1.database" .) }}
            exec pg_isready -U {{ include "postgresql.v1.username" . | default "postgres" | quote }} -d "dbname={{ include "postgresql.v1.database" . }} {{- if .Values.tls.enabled }} sslcert={{ include "postgresql.v1.tlsCert" . }} sslkey={{ include "postgresql.v1.tlsCertKey" . }}{{- end }}" -h 127.0.0.1 -p {{ .Values.containerPorts.postgresql }}
          {{- else }}
            exec pg_isready -U {{ include "postgresql.v1.username" . | default "postgres" | quote }} {{- if .Values.tls.enabled }} -d "sslcert={{ include "postgresql.v1.tlsCert" . }} sslkey={{ include "postgresql.v1.tlsCertKey" . }}"{{- end }} -h 127.0.0.1 -p {{ .Values.containerPorts.postgresql }}
          {{- end }}
      initialDelaySeconds: {{ .Values.primary.readinessProbe.initialDelaySeconds }}
      periodSeconds: {{ .Values.primary.readinessProbe.periodSeconds }}
      timeoutSeconds: {{ .Values.primary.readinessProbe.timeoutSeconds }}
      successThreshold: {{ .Values.primary.readinessProbe.successThreshold }}
      failureThreshold: {{ .Values.primary.readinessProbe.failureThreshold }}

# -- any postgreSQL config options here have highest priority and will override any existing config option values.
# Be sure you understand the impact of any values set as they might override the values required for other helm chart options.
# More details please see here: extended-config-configmap.yaml template
config: {}

# -- any extra env vars that will be avialable in DB pod.
envVars:
  # -- wal-g's WAL prefetch dir. Must be on the SAME filesystem as PGDATA: wal-g 3.x moves
  # prefetched segments into `$PGDATA/pg_wal` with rename(2), which fails across filesystems
  # ("invalid cross-device link"). Kept on the data PVC (mounts at `/bitnami/postgresql`) but
  # OUTSIDE PGDATA (`/bitnami/postgresql/data`) so it also avoids the postgresql-13 pg_rewind issue.
  # See: https://github.com/wal-g/wal-g/blob/master/docs/PostgreSQL.md
  WALG_PREFETCH_DIR: "/bitnami/postgresql/wal-g-prefetch"

backupRestore:
  # -- Storage config for backup & restore.
  # All supported storage and available storage config options can be found from [here](https://github.com/wal-g/wal-g/blob/master/docs/STORAGES.md).
  # e.g. 
  # ``` 
  # storageConfig:
  #   WALG_S3_PREFIX: "s3://bucket/path/to/folder"
  # ```
  # Secrets (e.g. `AWS_SECRET_ACCESS_KEY`) can be either set here or set in a manually created secret.
  # When use secret to storage secret, it's required to:
  # <ul>
  # <li>Set `.Values.backupRestore.storageSecretName` to the name of the secret contains all secret values for your storage option.</li>
  # <li>
  #   Mount the secret in a volume for DB pod (mount to path `/etc/wal-g.d/env`) by add an additional entry to `.Values.postgresql.primary.extraVolumes` & `.Values.postgresql.primary.extraVolumeMounts`. 
  # </li>
  # </ul>
  storageConfig: {}
  # -- For usage of this config option. Please see description of field `storageConfig`.
  storageSecretName: ""
  image:
    # -- wal-g docker image name
    name: "magda-wal-g"
    # -- wal-g docker image tag
    tag: "3.0.8-magda-edcda8b"
    # -- wal-g docker image repo
    repository: "ghcr.io/magda-io"
    # -- wal-g docker image pull policy
    pullPolicy: IfNotPresent
  backup:
    # -- whether backup feature should be turn on.
    # The change of this field (and all other fields in backupRestore section) will take effect after restart the database pod.
    enabled: false
    # -- To configure the size of one backup bundle (in bytes). See info of WALG_TAR_SIZE_THRESHOLD config option on [this page](https://github.com/wal-g/wal-g/blob/master/docs/PostgreSQL.md)
    # Due to [this issue](https://github.com/wal-g/wal-g/issues/1106), we set default value to 21474836480 (20G) to avoid oversize issue.
    # Users can set this setting to a bigger value if needs to create backup with bigger tablespace.
    walgTarSizeThreshold: "21474836480"
    # -- archive timeout setting. See: https://www.postgresql.org/docs/17/runtime-config-wal.html#GUC-ARCHIVE-TIMEOUT
    # This setting guarantees there would be at least one WAL segment file generated (Thus, avaiable for backup) within the time frame.
    # Lower this value will bloat your archive storage but will reduce the max. time window of data loss when you need to recover from the WAL achieve backup.
    # Default value is 600 seconds (10 mins)
    archiveTimeout: 600
    # -- See: https://www.postgresql.org/docs/17/runtime-config-wal.html#GUC-WAL-LEVEL
    # You shouldn't change this option unless for special reason.
    walLevel: "replica"
    # -- old backup will be removed every time when a new backup has been created.
    # the backup removal is done via [wal-g delete](https://github.com/wal-g/wal-g/blob/master/docs/README.md#delete)
    # This option specify the number of most recent backups to retain during the backup removal
    numberOfBackupToRetain: 7
    # -- schedule (in Cron Syntax) to perform [base backup](https://www.postgresql.org/docs/current/continuous-archiving.html).
    # default to every Saturday 15:00PM UTC time (Sydney Time 1:00AM Sunday).
    # The base backup is produced using [wal-g](https://github.com/wal-g/wal-g) via [base backup protocol](https://www.postgresql.org/docs/current/app-pgbasebackup.html) remotely.
    schedule: "0 15 * * 6"
    # -- resource config for the pod container that runs backup jobs. e.g.: <br/>
    # jobResourceConfig: <br/>
    # &nbsp;&nbsp;requests: <br/>
    # &nbsp;&nbsp;&nbsp;&nbsp;memory: "64Mi" <br/>
    # &nbsp;&nbsp;&nbsp;&nbsp;cpu: "250m" <br/>
    jobResourceConfig: {}
  recoveryMode:
    # -- Whether run the DB in the receovery mode.
    # When correct config is in place, recovery script will run (using [wal-g](https://github.com/wal-g/wal-g)) to restore DB using previous backup.
    # The change of this field (and all other fields in backupRestore section) will take effect after restart the database pod.
    enabled: false
    # -- the name of the base backup that will be used for restoring database.
    # By default, the latest base backup will be used.
    # If the latest base backup doesn't, you might want to list all available base backups in the target storage and pick an alternative base backup.
    # e.g. "base_000000020000000000000052".
    baseBackupName: "LATEST"
    # -- How far recovery replays the write-ahead log, i.e. the recovery target.
    # <ul>
    # <li>`"latest"` (default): roll forward through the archived WAL to the newest segment, then promote — recovers the least data loss (point-in-time-to-now).</li>
    # <li>`"immediate"`: restore to the chosen base backup only, without rolling forward (this was the behaviour before this option existed).</li>
    # <li>any other value: treated as a PostgreSQL `recovery_target_time` (point-in-time recovery to that timestamp, e.g. `"2026-08-01 12:00:00+00"`). Note: the chosen `baseBackupName` must predate the target time.</li>
    # </ul>
    recoveryTarget: "latest"

majorUpgrade:
  # -- One-shot PostgreSQL major upgrade (logical dump/restore) from a previous
  # in-cluster instance into this one. Turn on for the single `helm upgrade` that
  # crosses the major boundary, then turn it off again.
  # Safe to leave on: once a migration completes and passes its own verification, the
  # restore Job records that fact durably inside the new instance (a one-row
  # `public.magda_major_upgrade` table in its `postgres` database). On any later
  # `helm upgrade` the dump Job checks that marker on the target FIRST and exits without
  # dumping, and the restore Job checks it and exits without restoring — so a repeat
  # upgrade is a genuine no-op rather than an attempt to re-dump from a source Service
  # that no longer exists. Turning it off is still recommended, so the Jobs stop being
  # scheduled at all.
  # PostgreSQL data files are NOT readable across majors, and the pod labels this chart
  # emits land in the StatefulSet's immutable `spec.selector` -- so without this, a
  # cross-major `helm upgrade` either fails outright or brings up an empty database.
  # See the PostgreSQL major upgrade runbook.
  enabled: false
  # -- Hostname of the PREVIOUS major's in-cluster instance to dump from, i.e. its
  # `postgresql.fullnameOverride`. Defaulted per DB chart. Override it if you customised
  # `fullnameOverride` on the previous version, or the dump Job fails on an unresolvable
  # host.
  sourceHost: ""
  # -- Size of the staging volume that holds the gzipped logical dump. A compressed SQL
  # dump is far smaller than the data directory (no indexes, no bloat), but check it
  # against your actual database size before starting: running out of space mid-dump
  # fails the upgrade. The volume is created as a pre-upgrade hook and left behind after
  # the upgrade for inspection, but it is NOT durable across upgrades: while
  # `majorUpgrade.enabled` is true every `helm upgrade` deletes and recreates it empty.
  # Copy `dumpall.sql.gz` off it if you need to keep a dump; delete it once you have
  # verified the migration.
  stagingVolumeSize: "20Gi"
  # -- storageClass for the staging volume. Empty means the cluster default.
  stagingStorageClass: ""
  # -- How long each Job waits for its PostgreSQL server to start accepting connections.
  # This does NOT bound the dump or restore itself -- Helm's own `--timeout` does. Pass
  # `--timeout` comfortably larger than the expected dump + restore duration, or Helm
  # fails the upgrade while the Job is still working.
  waitTimeoutSeconds: 900
  # -- `sslmode` for connections to the PREVIOUS major's instance (`sourceHost`).
  # Deliberately NOT `global.postgresql.client.sslmode`: that describes the NEW
  # instance, which serves TLS. The source predates this chart's TLS support -- a v6
  # PostgreSQL 13 pod serves none -- so `require` fails every source connection with
  # "server does not support SSL, but SSL was required". `prefer` uses TLS when the
  # source offers it and plaintext when it does not. Set `require` only if you know
  # the source serves TLS.
  sourceSslMode: "prefer"
  # -- Resource config for the dump and restore Job containers.
  resources: {}
