{{- if .Values.backupRestore.backup.enabled -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: "{{ .Values.postgresql.fullnameOverride }}-backup-jobs"
spec:
  concurrencyPolicy: Forbid
  schedule: {{ .Values.backupRestore.backup.schedule | quote }}
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 1
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 3
      completions: 1
      parallelism: 1
      template:
        metadata:
          name: "{{ .Values.postgresql.fullnameOverride }}-backup-job"
          labels:
            cron: "{{ .Values.postgresql.fullnameOverride }}-backup-jobs"
        spec:
          {{- include "magda.imagePullSecrets" (dict "image" .Values.backupRestore.image) | indent 10 }}
          containers:
          - image: {{ include "magda.image" (dict "image" .Values.backupRestore.image) | quote }}
            imagePullPolicy: {{ include "magda.imagePullPolicy" (dict "image" .Values.backupRestore.image) | quote }}
            name: db-backup
            command:
              - "/bin/bash"
              - "-c"
              - |
                # Add user 1001 to /etc/passwd as postgres lib will check username in it
                # more details see the docker image repo
                /usr/local/bin/adduser.sh
                /usr/bin/envdir /etc/wal-g.d/env /usr/local/bin/wal-g backup-push
                # Capture the backup-push status immediately: any statement in
                # between (e.g. a variable assignment) resets $? and would make a
                # failed backup look successful -- which previously also let the
                # retention step below prune the existing chain after a failure.
                BACKUP_PUSH_RC=$?
                RETAIN_BACKUP_NUM="{{ .Values.backupRestore.backup.numberOfBackupToRetain | default 7 }}"
                if [[ $BACKUP_PUSH_RC = "0" ]] 
                then 
                  echo "New Base Backup Creation Completed!"
                  # Decide retention from the actual backup COUNT, not by matching
                  # wal-g's output text. The wording is not a stability guarantee and
                  # changed under v7's forked wal-g build: a benign empty result now
                  # prints "No backup found for deletion", which the old positional
                  # `${OUTPUT: -9} = "not found"` suffix match misread as an error.
                  # Count the FULL backups from `backup-list` and only trim when there
                  # are more than we retain -- then any non-zero `delete` exit is
                  # unambiguously a real error, no prose parsing involved. (#3763;
                  # output-classification convention: #3778.)
                  BACKUP_LIST=$(/usr/bin/envdir /etc/wal-g.d/env /usr/local/bin/wal-g backup-list 2>&1)
                  BACKUP_LIST_RC=$?
                  if [[ $BACKUP_LIST_RC != "0" ]]
                  then
                    # The backup itself succeeded; failing to LIST for retention is a
                    # real error but must not fail the backup Job -- skip trimming this
                    # run (and surface it, rather than silently pruning on a bad count).
                    echo "$BACKUP_LIST"
                    echo "Error: could not list backups to evaluate retention (wal-g backup-list exited $BACKUP_LIST_RC); skipping trim this run."
                  else
                    # A full base backup is a `base_<WAL>` entry; a delta backup is
                    # `base_<WAL>_D_<WAL>`. `delete ... retain FULL N` retains N FULL
                    # backups, so count those. (INFO lines wal-g writes to stderr are
                    # folded in by 2>&1 above but never start with `base_`.)
                    FULL_BACKUP_COUNT=$(printf '%s\n' "$BACKUP_LIST" | awk '/^base_/ && !/_D_/ {n++} END {print n+0}')
                    echo "Found $FULL_BACKUP_COUNT full backup(s); retention target is $RETAIN_BACKUP_NUM."
                    if [[ "$FULL_BACKUP_COUNT" -gt "$RETAIN_BACKUP_NUM" ]]
                    then
                      echo "Start to trim old backups and retain the recent $RETAIN_BACKUP_NUM backups..."
                      if /usr/bin/envdir /etc/wal-g.d/env /usr/local/bin/wal-g delete --confirm retain FULL $RETAIN_BACKUP_NUM
                      then
                        echo "Trimming old backups Completed!"
                      else
                        # Print the error but do not exit non-zero: the backup itself
                        # succeeded, and a retention/trim failure should not fail the Job.
                        echo "Error: failed to trim the old backups."
                      fi
                    else
                      echo "There are $FULL_BACKUP_COUNT full backup(s), at or below the retention target of $RETAIN_BACKUP_NUM. Nothing needs to be deleted!"
                    fi
                  fi
                else 
                  echo "Failed to create new base backup!"
                  exit 1
                fi
{{- if not (empty .Values.backupRestore.backup.jobResourceConfig) }}
            resources:
{{ .Values.backupRestore.backup.jobResourceConfig | toYaml | indent 14 }}
{{- end }}
{{- if or (not (empty .Values.backupRestore.storageSecretName)) (eq (include "magda.postgres-client-ca-enabled" .) "true") }}
            volumeMounts:
{{- if not (empty .Values.backupRestore.storageSecretName) }}
              - name: storage-secret
                mountPath: /etc/wal-g.d/env
{{- end }}
{{- if eq (include "magda.postgres-client-ca-enabled" .) "true" }}
              {{- include "magda.postgres-client-ca-volumemount" . | nindent 14 }}
{{- end }}
{{- end }}
            env:
              - name: PGHOST
                value: {{ .Values.postgresql.fullnameOverride | quote }}
              - name: WALG_TAR_SIZE_THRESHOLD
                value: {{ .Values.backupRestore.backup.walgTarSizeThreshold | quote }}
{{- include "magda.postgres-superuser-env" . | indent 14 }}
{{- include "magda.db-client-ca-env-libpq" . | indent 14 }}
{{- if not (empty .Values.backupRestore.storageConfig) }}
            {{- range $key, $value := .Values.backupRestore.storageConfig }}
            {{- if not (empty $key) }}
              - name: {{ $key | quote }}
                value: {{ $value | quote }}
            {{- end }}
            {{- end }}
{{- end }}
          restartPolicy: OnFailure
{{- if or (not (empty .Values.backupRestore.storageSecretName)) (eq (include "magda.postgres-client-ca-enabled" .) "true") }}
          volumes:
{{- if not (empty .Values.backupRestore.storageSecretName) }}
            - name: storage-secret
              secret:
                secretName: "{{ .Values.backupRestore.storageSecretName }}"
{{- end }}
{{- if eq (include "magda.postgres-client-ca-enabled" .) "true" }}
            {{- include "magda.postgres-client-ca-volume" . | nindent 12 }}
{{- end }}
{{- end }}
{{- end }}
