{{- /*
  The certificate secret must be created by EXACTLY the condition that makes the
  postgresql subchart consume it, otherwise a configuration exists where the
  StatefulSet mounts a secret nothing created and every DB pod sits in
  `ContainerCreating` forever.

  The subchart mounts the secret named by `.Values.tls.certificatesSecret`
  (our `.Values.postgresql.tls.certificatesSecret`) when, and only when, its own
  `.Values.tls.enabled` (our `.Values.postgresql.tls.enabled`) is true — see
  bitnami postgresql 16.7.24 `templates/primary/statefulset.yaml`. So this template is
  gated on that same value and names the secret from that same value: there is
  no second source of truth that could drift.

  Since bitnami postgresql 12 the value is run through `tpl` by the
  `postgresql.v1.tlsSecretName` helper, in the SUBCHART's scope — where `.Values` is
  our `.Values.postgresql`. We render it the same way, against a synthetic context, so
  a templated default like "{{ .Values.fullnameOverride }}-crt" resolves here to
  exactly the name the StatefulSet will mount.

  In particular this is deliberately NOT gated on `global.useAwsRdsDb` /
  `global.useCloudSql`. The combined-db StatefulSet still renders under those
  flags (it is simply left idle), and a wrapper chart cannot compute a subchart
  value, so `postgresql.tls.enabled` cannot be turned off for that idle
  StatefulSet — meaning it still mounts the certificate and still needs it to
  exist.
*/}}
{{- if .Values.postgresql.tls.enabled }}
{{- $fullname := .Values.postgresql.fullnameOverride }}
{{- $subCtx := dict "Values" .Values.postgresql "Release" .Release "Chart" .Chart "Template" .Template "Capabilities" .Capabilities "Files" .Files }}
{{- $secretName := tpl (required "postgresql.tls.certificatesSecret is required when postgresql.tls.enabled is true" .Values.postgresql.tls.certificatesSecret) $subCtx }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) | default dict }}
{{- $existingData := (get $existing "data") | default dict }}
{{- /*
  Reuse the existing certificate when one is already present. bitnami's own
  `tls.autoGenerated` regenerates the CA on EVERY `helm upgrade`, because its
  template calls genCA/genSignedCert unconditionally. Preserving ours via
  `lookup` — the same pattern db-main-account-secret.yaml uses — keeps the
  certificate stable across upgrades.
*/}}
{{- if and (get $existingData "tls.crt") (get $existingData "tls.key") (get $existingData "ca.crt") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName | quote }}
  annotations:
    "helm.sh/resource-policy": keep
type: kubernetes.io/tls
data:
  ca.crt: {{ get $existingData "ca.crt" }}
  tls.crt: {{ get $existingData "tls.crt" }}
  tls.key: {{ get $existingData "tls.key" }}
{{- else }}
{{- $ns := .Release.Namespace }}
{{- /*
  SANs cover the logical service names Magda services actually dial, not just the
  StatefulSet name. Nothing verifies the certificate today (clients use
  `require`), but this is what makes in-cluster `verify-full` possible later.
*/}}
{{- $altNames := list
      $fullname
      (printf "%s.%s.svc.cluster.local" $fullname $ns)
      "combined-db" (printf "combined-db.%s.svc.cluster.local" $ns)
      "authorization-db" (printf "authorization-db.%s.svc.cluster.local" $ns)
      "content-db" (printf "content-db.%s.svc.cluster.local" $ns)
      "registry-db" (printf "registry-db.%s.svc.cluster.local" $ns)
      "session-db" (printf "session-db.%s.svc.cluster.local" $ns)
      "tenant-db" (printf "tenant-db.%s.svc.cluster.local" $ns)
      "localhost" "127.0.0.1" }}
{{- $ca := genCA (printf "%s-ca" $fullname) 3650 }}
{{- $cert := genSignedCert $fullname (list "127.0.0.1") $altNames 3650 $ca }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName | quote }}
  annotations:
    "helm.sh/resource-policy": keep
type: kubernetes.io/tls
data:
  ca.crt: {{ $ca.Cert | b64enc | quote }}
  tls.crt: {{ $cert.Cert | b64enc | quote }}
  tls.key: {{ $cert.Key | b64enc | quote }}
{{- end }}
{{- end }}
