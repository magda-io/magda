apiVersion: v1
kind: Namespace
metadata:
  name: magda-agent-poc
---
# Deterministic OpenAI Chat Completions mock (mock-llm/server.mjs).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-llm
  namespace: magda-agent-poc
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mock-llm}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mock-llm}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mock-llm
          image: magda-agent-poc-tools:dev
          imagePullPolicy: Never
          command: ["node", "mock-llm/server.mjs"]
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: mock-llm
  namespace: magda-agent-poc
spec:
  selector: {app.kubernetes.io/name: mock-llm}
  ports: [{port: 80, targetPort: 8080}]
