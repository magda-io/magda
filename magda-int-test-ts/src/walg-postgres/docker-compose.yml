version: "3"
services:
  test-walg-postgres:
    image: postgres:13.7
    command:
      [
        "-c",
        "wal_level=replica",
        "-c",
        "max_wal_senders=3",
        "-c",
        "archive_mode=off"
      ]
    expose:
      - 5432
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: "password"
      POSTGRES_HOST_AUTH_METHOD: "trust"
