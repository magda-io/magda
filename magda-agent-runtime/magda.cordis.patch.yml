# Production Magda Agent Workspace overlay for the pinned DSH runtime.
# DSH binds directly to the Sandbox Pod network; no bridge sidecar is used.
- id: webserver
  config:
    host: 0.0.0.0
    port: 3080
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024
    # Attachment uploads stream through the Agent Manager for up to an hour
    # (global.agentWorkspace.maxUploadBytes); Node's default is five minutes.
    requestTimeoutMs: 3600000

# Magda owns the single provider and model. The lifecycle bootstrap writes the
# raw API-key credential to /data/config/magda-agent.env and restarts the
# container; the credential is the user's lifecycle-bound Magda API key, never a
# provider secret. DSH's adapter adds the HTTP authorization scheme.
#
# The model itself is the one agent-services.model selects from the models in
# global.llmServices, validated by Helm and delivered as one JSON Pod env
# value, MAGDA_LLM_MODEL_CONFIG. The
# entrypoint refuses to start without it, and the Agent Manager refreshes it
# each time the Workspace resumes.
- id: llm-pi-ai
  config:
    providers:
      magda:
        displayName: Magda LLM
        apiKeyEnv: MAGDA_LLM_API_KEY
        api: openai-responses
        baseURL: !!js process.env.MAGDA_LLM_BASE_URL
        # The effort for requests that name none: session titles and context
        # compaction (auxiliaryReasoningEffort, which defaults to the main-turn
        # effort). Unset, they send no reasoning option and the provider uses
        # its own default.
        reasoning: !!js JSON.parse(process.env.MAGDA_LLM_MODEL_CONFIG).auxiliaryReasoningEffort || undefined
        models:
          - id: !!js JSON.parse(process.env.MAGDA_LLM_MODEL_CONFIG).alias
            name: !!js JSON.parse(process.env.MAGDA_LLM_MODEL_CONFIG).displayName
            contextWindow: !!js JSON.parse(process.env.MAGDA_LLM_MODEL_CONFIG).contextWindow
            maxTokens: !!js JSON.parse(process.env.MAGDA_LLM_MODEL_CONFIG).maxTokens
            # Text only unless the deployment declares a vision-capable model
            # (imageInput); DSH then attaches images.
            # Quoted: unquoted, YAML reads the expression's ': ' as a mapping.
            input: !!js "JSON.parse(process.env.MAGDA_LLM_MODEL_CONFIG).imageInput ? ['text', 'image'] : ['text']"
            # The levels the model accepts, each mapped to the value sent to
            # the API, or false for a model that doesn't reason. Helm requires
            # a value for `off`: a valueless `off` makes requests without an
            # effort send `effort: "none"` (#3963). An undeclared level isn't
            # offered, and an explicit one fails before any request.
            reasoningEfforts: !!js JSON.parse(process.env.MAGDA_LLM_MODEL_CONFIG).reasoningEfforts

# Session titles run at the auxiliary effort (#3963). Reasoning tokens count
# toward the output cap, so DSH's 64-token cap often ended a title request
# before any title text, and the session kept its fallback title. Usage is
# billed by tokens used, not by this cap. Patching a row replaces its whole
# config, so the other fields repeat DSH's defaults.
- id: session-title-llm
  config:
    targetWords: 5
    targetCjkCharacters: 10
    maxInputBytes: 4096
    maxOutputTokens: 1024
    timeoutMs: 60000

- id: agent-default-model
  config:
    provider: magda
    model: !!js JSON.parse(process.env.MAGDA_LLM_MODEL_CONFIG).alias
    # The main-turn effort (reasoningEffort).
    reasoningEffort: !!js JSON.parse(process.env.MAGDA_LLM_MODEL_CONFIG).reasoningEffort || undefined

# The managed deployment exposes only confined presets. Per-action approval is
# retained and defaults to ask.
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask

# Provider/model/plugin management is deployment-owned and intentionally absent
# from the managed browser profile.
- id: tool-plugin-manager
  disabled: true
- id: plugin-manager
  disabled: true
- id: ui-plugin-manager
  disabled: true
- id: ui-settings-models
  disabled: true
- id: ui-settings-plugin-inventory
  disabled: true
- id: ui-settings-plugins
  disabled: true
- id: ui-settings-shell
  disabled: true
- id: ui-settings-agent-loop
  disabled: true
- id: ui-settings-subagent
  disabled: true
- id: ui-settings-web-search
  disabled: true

# The managed profile fixes model and permission policy at deployment time and
# does not expose deployment feedback collection as an agent command.
- id: ui-model-selection
  disabled: true
- id: ui-permission
  disabled: true
- id: command-feedback
  disabled: true
- id: ui-message-feedback
  disabled: true
- insert:
    - id: ui-managed-profile
      name: "@magda/dsh-client-managed-profile"
    # MAGDA's workflow-capture suggestion guidance is a separately named prompt
    # section. Patching `system-prompt` would replace that row's whole config,
    # and each agent preset's persona row shadows its persona suffix anyway.
    - id: magda-workflow-capture-guidance
      name: "@magda/dsh-workflow-capture-guidance"
    # Typed Agent Skill tools run `mgd agent-skill publish|delete|sync|pull`
    # from the host process with fixed arguments, so publishing needs only the
    # user's publishing decision, not a generic Bash sandbox escalation.
    - id: magda-agent-skill-tools
      name: "@magda/dsh-agent-skill-tools"

# DSH's own Office skills (office-docx, office-pptx, office-xlsx) and their
# interpreter query. The payload is MAGDA's read-only venv over Debian Python,
# used in place (no `root`, so nothing is copied to the PVC). skill-office keeps
# its packaged assets and this Node; its CLI entry is MAGDA's wrapper, which runs
# the installed LibreOffice Kit CLI unchanged, one command at a time.
- insert:
    - id: workspace-dependencies
      name: '@deepseek-ai/dsh-tool-workspace-dependencies'
      config:
        source: /usr/local/lib/magda-agent/primary-runtime
    - id: skill-office
      name: '@deepseek-ai/dsh-skill-office'
      config:
        cli: /usr/local/lib/magda-agent/libreoffice-kit-cli.mjs

# DSH Web's Office previews run LibreOffice Kit conversions inside the Web
# process, each peaking at about 1.2 GiB. Allow one at a time and no
# speculative background conversions, so a preview plus one agent-run Kit
# command fits the Workspace memory limit (three at once are OOM-killed).
- id: office-to-pdf
  config:
    maxConcurrentConversions: 1
    maxBackgroundConversions: 0

- id: session-log-deepseek
  disabled: true

- id: workspace-controller
  config:
    documentsDirectory: /data/workspace
    documentsLookupTimeoutMs: 10000
